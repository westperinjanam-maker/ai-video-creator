<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Creator</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f7f7fb;font-family:Inter,Arial,sans-serif}header{padding:24px 6%;border-bottom:1px solid #252936;display:flex;justify-content:space-between}.logo{font-weight:800;font-size:20px}.pill{border:1px solid #343948;border-radius:99px;padding:7px 12px;font-size:12px;color:#b9bfcd}main{width:min(1100px,92%);margin:34px auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#13161d;border:1px solid #292e3a;border-radius:22px;padding:24px}h1{font-size:40px;line-height:1.05;margin:0 0 10px}.muted{color:#9ca4b5;margin-bottom:22px}label{display:block;color:#b9c0ce;font-size:13px;margin:15px 0 7px}textarea,select,input{width:100%;background:#0d1016;color:white;border:1px solid #303646;border-radius:11px;padding:12px;font:inherit}textarea{min-height:145px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:12px 16px;border-radius:11px;border:0;font-weight:800;cursor:pointer}.primary{background:#fff;color:#111}.secondary{background:#232834;color:#fff;border:1px solid #343a49}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.preview{aspect-ratio:9/16;background:#090b0f;border:1px solid #2b303c;border-radius:17px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview video{width:100%;height:100%;object-fit:contain}.empty{text-align:center;color:#697286;padding:30px}.status{color:#aab2c1;font-size:13px;margin-top:15px;min-height:18px}.bar{height:5px;background:#252a35;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:.4s}.drop{padding:14px;border:1px dashed #3a4150;border-radius:12px}@media(max-width:800px){main{grid-template-columns:1fr}h1{font-size:32px}}
</style></head><body><header><div class="logo">✦ AI Video Creator</div><div class="pill">Sora video studio</div></header><main><section class="card"><h1>Turn ideas into video.</h1><div class="muted">Text-to-video and image-to-video in one simple creator.</div><label>Prompt</label><textarea id="prompt" placeholder="A luxury perfume bottle on black marble, soft golden light, slow camera push-in, premium commercial..."></textarea><div class="actions"><button class="secondary" id="enhance">✨ Enhance prompt</button></div><div class="row"><div><label>Model</label><select id="model"><option>sora-2</option><option>sora-2-pro</option></select></div><div><label>Duration</label><select id="seconds"><option>4</option><option>8</option><option>12</option></select></div></div><label>Format</label><select id="size"><option value="720x1280">9:16 Portrait</option><option value="1280x720">16:9 Landscape</option><option value="1024x1792">9:16 High resolution</option><option value="1792x1024">16:9 High resolution</option></select><label>Image reference (optional)</label><div class="drop"><input id="image" type="file" accept="image/*"></div><div class="actions"><button class="primary" id="go">Generate video</button></div><div class="status" id="status"></div><div class="bar"><i id="progress"></i></div></section><section class="card"><div class="preview" id="preview"><div class="empty">Your generated video will appear here.</div></div><div class="actions" id="dl" style="display:none"><a id="link"><button class="primary">Download MP4</button></a></div></section></main><script>
const $=x=>document.getElementById(x);let id;
$('enhance').onclick=async()=>{if(!$('prompt').value.trim())return alert('Enter a prompt first.');$('status').textContent='Enhancing prompt...';try{let r=await fetch('/api/enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt').value})});let d=await r.json();if(!r.ok)throw Error(d.error);$('prompt').value=d.prompt.trim();$('status').textContent='Prompt enhanced.'}catch(e){$('status').textContent=e.message}};
$('go').onclick=async()=>{if(!$('prompt').value.trim())return alert('Enter a prompt first.');$('go').disabled=true;$('status').textContent='Starting generation...';$('progress').style.width='5%';let f=new FormData();f.append('prompt',$('prompt').value);f.append('model',$('model').value);f.append('seconds',$('seconds').value);f.append('size',$('size').value);if($('image').files[0])f.append('image',$('image').files[0]);try{let r=await fetch('/api/generate',{method:'POST',body:f});let d=await r.json();if(!r.ok)throw Error(d.error);id=d.id;poll()}catch(e){$('status').textContent=e.message;$('go').disabled=false}};
async function poll(){let r=await fetch('/api/generate/'+id);let d=await r.json();if(!r.ok){$('status').textContent=d.error;$('go').disabled=false;return}$('progress').style.width=(d.progress||0)+'%';$('status').textContent=(d.status||'processing')+' · '+Math.round(d.progress||0)+'%';if(d.status==='completed'){$('progress').style.width='100%';$('status').textContent='Video ready.';$('preview').innerHTML='<video controls autoplay loop src="/api/generate/'+id+'/download"></video>';$('link').href='/api/generate/'+id+'/download';$('dl').style.display='flex';$('go').disabled=false}else if(d.status==='failed'){$('status').textContent='Generation failed.';$('go').disabled=false}else setTimeout(poll,2500)}
</script></body></html>
